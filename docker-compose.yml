services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: garden_store
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "garden", "-d", "garden_store"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://garden:secret@db:5432/garden_store
      AGENT_URL: http://localhost:8000/rpc
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      FRONTEND_ORIGIN: http://localhost:5173
      OLLAMA_BASE_URL: http://${WINDOWS_HOST_IP:-host.docker.internal}:11434
      OLLAMA_MODEL: llama3.1:70b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/workspace/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
