[project]
name = "agent-exploration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Will Nash", email = "will@koan.co.nz" }
]
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
agent-exploration = "agent_exploration:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
